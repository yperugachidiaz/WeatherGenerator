# ERA5 decoder stream for all variables except t_850 and z_500 (issue #2636: separate
# physical decoder for z/t). Split from seb_jepa_forecast_multi_data_all_years/era5.yml;
# identical except for the target list and loss_weight (only t_850/z_500 move to ERA5_Z500T850).
# Input side is unchanged (ERA5_in in analysis.yml).
# loss_weight = 2 * 66/68, see era5_z500t850.yml for the parity derivation.

ERA5_REST:
  type: anemoi
  filenames : ['aifs-ea-an-oper-0001-mars-o96-1979-2024-1h-v3-with-era51.zarr'] #['aifs-ea-an-oper-0001-mars-o96-1979-2023-6h-v8.zarr']
  # filenames: # ['aifs-od-an-oper-0001-mars-o96-2016-2023-6h-v6.zarr']
  stream_id: 0
  source: []  # decoder-only stream (diagnostic); ERA5 input comes from ERA5_in in analysis.yml
  target: ['q_150', 'q_200', 'q_250', 'q_300', 'q_400', 'q_500', 'q_600', 'q_700', 'q_850', 'q_925', 'q_1000', 't_50', 't_100', 't_150', 't_200', 't_250', 't_300', 't_400', 't_500', 't_600', 't_700', 't_925', 't_1000', 'u_50', 'u_100', 'u_150', 'u_200', 'u_250', 'u_300', 'u_400', 'u_500', 'u_600', 'u_700', 'u_850', 'u_925', 'u_1000', 'v_50', 'v_100', 'v_150', 'v_200', 'v_250', 'v_300', 'v_400', 'v_500', 'v_600', 'v_700', 'v_850', 'v_925', 'v_1000', 'z_50', 'z_100', 'z_150', 'z_200', 'z_250', 'z_300', 'z_400', 'z_600', 'z_700', 'z_850', 'z_925', 'z_1000', '10u', '10v', '2d', '2t', 'msl']
  geoinfo_channels: ['z', 'lsm', 'slor', 'sdor', 'insolation', 'cos_local_time', 'sin_local_time', 'cos_julian_day', 'sin_julian_day', 'noise_time']
  loss_weight: 1.9412  # 2 * 66/68, per-channel parity with single-decoder baseline
  diagnostic: True
  location_weight: cosine_latitude
  token_size: 8
  tokenize_spacetime: False
  max_num_targets: -1
  # frequency: 06:00:00
  embed :
    net : transformer
    num_tokens : 1
    num_heads : 8
    dim_embed : 512
    num_blocks : 2
  embed_target_coords :
    net : linear
    dim_embed : 512
  target_readout :
    num_layers : 2
    num_heads : 4
  pred_head :
    ens_size : 1
    num_layers : 1
